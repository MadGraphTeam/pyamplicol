# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[dependencies]
feynkit-model = { git = "https://github.com/alphal00p/gammaloop.git", rev = "2adabf54b5e68af9def8df794f4d8f0b06ea33a8", default-features = false, features = ["native"] }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "2adabf54b5e68af9def8df794f4d8f0b06ea33a8", default-features = false, features = ["native"] }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "c3534e66d81013b16919ee91bc794ae4392abfc0" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "c3534e66d81013b16919ee91bc794ae4392abfc0" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "c3534e66d81013b16919ee91bc794ae4392abfc0", features = ["native-masters"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "8ec256fc26cb361b20e10f59c19beb35717ef32c", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
