# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[dependencies]
feynkit-amplitude = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
feynkit-generator = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
idenso = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
spenso = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native", "shadowing"] }
spenso-hep-lib = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
feynkit-model = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "6cbe1b4d296eb78767a55b9ce9cd25ef67feed41", default-features = false, features = ["native"] }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "084e466bd464bf4cf847fe5708503d62bc835ca9" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "084e466bd464bf4cf847fe5708503d62bc835ca9" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "084e466bd464bf4cf847fe5708503d62bc835ca9", features = ["native-masters"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "8ec256fc26cb361b20e10f59c19beb35717ef32c", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
